<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Rodolfo Rodrigues</title>
  <desc id="description">Animated cyber security and artificial intelligence profile banner.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B14">
        <animate attributeName="stop-color" values="#050B14;#071827;#050B14" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="0.55" stop-color="#082536" />
      <stop offset="1" stop-color="#063B49">
        <animate attributeName="stop-color" values="#063B49;#07566A;#063B49" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" />
      <stop offset="0.5" stop-color="#47F5C8" />
      <stop offset="1" stop-color="#00A8C6" />
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.38" />
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#4BE7F5" stroke-width="0.7" opacity="0.13" />
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="3" y="3" width="1194" height="294" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)" />
    <rect width="1200" height="300" fill="url(#grid)" />

    <circle cx="1040" cy="125" r="220" fill="url(#glow)">
      <animate attributeName="r" values="190;235;190" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite" />
    </circle>

    <g fill="none" stroke="#00D8EF" stroke-width="2" opacity="0.65">
      <path d="M830 62 H922 L965 105 H1112" stroke-dasharray="10 15">
        <animate attributeName="stroke-dashoffset" from="0" to="-50" dur="2.8s" repeatCount="indefinite" />
      </path>
      <path d="M790 229 H906 L952 183 H1145" stroke-dasharray="8 14">
        <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3.4s" repeatCount="indefinite" />
      </path>
      <path d="M905 142 H1085" stroke-dasharray="6 12">
        <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.2s" repeatCount="indefinite" />
      </path>
    </g>

    <g fill="#06141F" stroke="#47F5C8" stroke-width="2" filter="url(#softGlow)">
      <circle cx="922" cy="62" r="6">
        <animate attributeName="r" values="5;9;5" dur="2.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="965" cy="105" r="7">
        <animate attributeName="r" values="6;10;6" dur="3.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="1085" cy="142" r="7">
        <animate attributeName="r" values="6;11;6" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="952" cy="183" r="6">
        <animate attributeName="r" values="5;9;5" dur="3.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="906" cy="229" r="6">
        <animate attributeName="r" values="5;9;5" dur="2.9s" repeatCount="indefinite" />
      </circle>
    </g>

    <g transform="translate(1010 112)" fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#softGlow)" opacity="0.9">
      <path d="M0 -54 L50 -27 V31 C50 68 23 88 0 98 C-23 88 -50 68 -50 31 V-27 Z" />
      <rect x="-21" y="12" width="42" height="35" rx="7" />
      <path d="M-13 12 V-1 C-13 -19 13 -19 13 -1 V12" />
      <circle cx="0" cy="29" r="4" fill="#47F5C8" stroke="none" />
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="74" y="119" fill="#F4FBFF" font-size="52" font-weight="700" letter-spacing="1.5">Rodolfo Rodrigues</text>
      <rect x="76" y="139" width="510" height="4" rx="2" fill="url(#accent)">
        <animate attributeName="width" values="90;510;510" keyTimes="0;0.65;1" dur="2.2s" repeatCount="1" />
      </rect>
      <text x="76" y="180" fill="#A9EAF1" font-size="22" font-weight="500">Senior Software Engineer • AI &amp; Cybersecurity</text>
      <text x="76" y="224" fill="#47F5C8" font-family="Consolas, Menlo, monospace" font-size="17">&gt; engineering secure, auditable and resilient systems</text>
      <rect x="624" y="207" width="10" height="21" rx="1" fill="#47F5C8">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>

    <rect x="3" y="3" width="1194" height="294" rx="24" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.82" />
  </g>
</svg>
